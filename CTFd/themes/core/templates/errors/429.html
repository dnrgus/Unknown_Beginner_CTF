{% extends "base.html" %}

{% block content %}
  <div class="unknown-error-page">
    <div class="unknown-error-card">
      <p class="unknown-error-code">429</p>
      <h1>{% trans %}SLOW DOWN{% endtrans %}</h1>
      <p>{% trans %}Too many requests. Please wait a moment and try again.{% endtrans %}</p>

      <div class="unknown-cta-row unknown-error-actions">
        <a class="btn unknown-btn unknown-btn-primary" href="{{ url_for('views.static_html', route='/') }}">{% trans %}RETURN HOME{% endtrans %}</a>
      </div>
    </div>
  </div>
{% endblock %}
