{% extends "base.html" %}

{% block content %}
  <div class="unknown-error-page">
    <div class="unknown-error-card">
      <p class="unknown-error-code">401</p>
      <h1>{% trans %}AUTHENTICATION REQUIRED{% endtrans %}</h1>
      <p>{{ error }}</p>

      <div class="unknown-cta-row unknown-error-actions">
        <a class="btn unknown-btn unknown-btn-primary" href="{{ url_for('auth.login') }}">{% trans %}LOGIN{% endtrans %}</a>
        <a class="btn unknown-btn unknown-btn-secondary" href="{{ url_for('views.static_html', route='/') }}">{% trans %}RETURN HOME{% endtrans %}</a>
      </div>
    </div>
  </div>
{% endblock %}
