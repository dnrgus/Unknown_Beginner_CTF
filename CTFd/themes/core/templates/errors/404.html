{% extends "base.html" %}

{% block content %}
  <div class="unknown-error-page">
    <div class="unknown-error-card">
      <p class="unknown-error-code">404</p>
      <h1>{% trans %}TARGET NOT FOUND{% endtrans %}</h1>
      <p>{% trans %}The page you're looking for doesn't exist.{% endtrans %}</p>

      <div class="unknown-cta-row unknown-error-actions">
        <a class="btn unknown-btn unknown-btn-primary" href="{{ url_for('views.static_html', route='/') }}">{% trans %}RETURN HOME{% endtrans %}</a>
        <a class="btn unknown-btn unknown-btn-secondary" href="{{ url_for('challenges.listing') }}">{% trans %}VIEW CHALLENGES{% endtrans %}</a>
      </div>
    </div>
  </div>
{% endblock %}
